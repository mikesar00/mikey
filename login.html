<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReClaimMe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-header">
        <div class="logo">
            <img src="logo.jpg" alt="Logo">
            <h1>ReClaimMe</h1>
        </div>
    </header>
    <div class="main-container">
        <div class="image-section">
            <img src="img.jpg" alt="Lost and Found">
        </div>
        <div class="login-box">
            <form action="">
                <h2>login</h2>
                <div class="input-box">
                    <input type="email" required>
                    <label>Email or Student ID</label>
                </div>
                <div class="input-box">
                    <input type="password" required>
                    <label>password</label>
                </div> 
                <div class="remember-forgot">
                    <label><input type="checkbox"> Remember me</label>
                    <a href="forgot.html">Forgot Password?</a>
                </div>
                <button type="submit">Login</button>
                <div class="register-link">
                    <p>Don't have an account? <a href="register.html">Register</a></p>
            
                </div>
            </form>
        </div>
    </div>
    <footer class="footer">
        <div class="footer-left">
            <h3> ReClaimMe</h3>
            <p>Lost items? We've got a team dedicated to bringing them back to you.</p>
        </div>
        <div class="footer-center">
            <p>© Copyright 2025 ReClaimMe<br>All Rights Reserved</p>
        </div>
        <div class="footer-right">
            <h4>Contact</h4>
            <p>Tel: +93463575478<br>Email: reclaimme@gmail.com</p>
        </div>
    </footer>
</body>
</html>
